<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
  <title id="page-title">Mundo Digital - Acesso Rápido</title>
  <meta content="#060c1a" name="theme-color">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #060c1a;
      --card: rgba(12, 21, 41, 0.94);
      --card-hover: rgba(19, 32, 60, 0.98);
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --danger: #ef4444;
      --gold: #facc15;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #lock-screen {
      position: fixed; inset: 0;
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      display: flex; align-items: center; justify-content: center; z-index: 99999;
      padding: 16px;
    }
    .lock-card {
      background: var(--card); border: 1px solid var(--border);
      padding: 32px 24px; border-radius: 16px; width: 100%; max-width: 360px;
      text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }
    .lock-logo {
      max-width: 130px; max-height: 80px; object-fit: contain; margin-bottom: 16px;
    }
    .lock-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .lock-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .lock-input {
      width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.5);
      border: 1px solid var(--border); border-radius: 8px; color: #fff;
      font-size: 16px; outline: none; margin-bottom: 16px; text-align: center;
    }
    .lock-input:focus { border-color: var(--primary); }
    .lock-btn {
      width: 100%; padding: 14px; background: var(--primary);
      color: #040812; border: none; border-radius: 8px; font-weight: 700;
      font-size: 15px; cursor: pointer; transition: 0.2s;
    }
    .lock-btn:hover { background: var(--primary-hover); }
    .lock-err { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; font-weight: 500; }

    #app-container { display: none; flex-direction: column; flex: 1; }
    
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; flex-direction: column; gap: 12px;
      backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
    }
    
    .header-top {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .header-logo { height: 36px; width: auto; object-fit: contain; }
    .brand h1 { font-size: 16px; font-weight: 700; }
    .brand span { font-size: 11px; background: rgba(56,189,248,0.15); color: var(--primary); padding: 3px 8px; border-radius: 12px; font-weight: 600; }

    .header-actions { display: flex; gap: 8px; align-items: center; width: 100%; }

    .search-box { position: relative; display: flex; align-items: center; flex: 1; }
    .search-box i { position: absolute; left: 12px; color: var(--text-muted); font-size: 13px; }
    .search-input {
      padding: 10px 12px 10px 34px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 14px; outline: none; width: 100%; transition: all 0.2s;
    }
    .search-input:focus { border-color: var(--primary); background: rgba(0, 0, 0, 0.7); }

    .action-buttons-group { display: flex; gap: 6px; }

    .btn-action, .btn-secondary-action {
      padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
      white-space: nowrap; height: 38px;
    }
    .btn-action { background: var(--primary); color: #040812; border: none; }
    .btn-action:hover { background: var(--primary-hover); }
    .btn-secondary-action { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary-action:hover { background: rgba(255, 255, 255, 0.15); }
    .btn-secondary-action.active-sort { border-color: var(--primary); color: var(--primary); }

    main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 16px 12px; }

    .category-group {
      margin-bottom: 24px; background: rgba(12, 21, 41, 0.6);
      border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    }
    .category-group.fav-group {
      border-color: rgba(250, 204, 21, 0.35); background: rgba(250, 204, 21, 0.04);
    }
    .category-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 10px;
    }
    .category-title {
      font-size: 15px; font-weight: 700; color: var(--primary);
      display: flex; align-items: center; gap: 8px;
    }
    .fav-group .category-title { color: var(--gold); }
    .cat-actions { display: flex; gap: 2px; }
    .btn-cat-tool {
      background: transparent; border: none; color: #64748b; font-size: 12px;
      cursor: pointer; padding: 6px 8px; border-radius: 4px; transition: 0.2s;
    }
    .btn-cat-tool:hover { color: var(--text); }
    .btn-cat-tool.del:hover { color: var(--danger); }

    .grid-cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .panel-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; display: flex; flex-direction: column;
      gap: 12px; position: relative; transition: 0.2s; backdrop-filter: blur(6px);
    }
    .panel-card:hover { border-color: #334155; transform: translateY(-2px); background: var(--card-hover); }
    .panel-header { display: flex; align-items: center; gap: 12px; }
    
    .panel-icon-box {
      width: 44px; height: 44px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .panel-icon-box img { width: 100%; height: 100%; object-fit: cover; }
    .panel-icon-box i { font-size: 20px; color: var(--primary); }

    .panel-info { flex: 1; overflow: hidden; min-width: 0; }
    .panel-name { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-desc { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    
    .panel-ctrls { display: flex; gap: 4px; align-items: center; }
    .btn-card-ctrl {
      background: transparent; border: none; color: #64748b;
      cursor: pointer; padding: 8px; border-radius: 6px; font-size: 14px; transition: 0.2s;
    }
    .btn-card-ctrl:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .btn-card-ctrl.fav-btn.is-fav { color: var(--gold); }
    .btn-card-ctrl.del:hover { color: var(--danger); }

    .panel-links { display: flex; gap: 8px; }
    .btn-open {
      flex: 1; text-align: center; background: rgba(56,189,248,0.12); color: var(--primary);
      text-decoration: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-open:hover { background: var(--primary); color: #040812; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 10000;
      padding: 12px;
    }
    .modal {
      background: #0c1529; border: 1px solid var(--border);
      padding: 20px; border-radius: 14px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-size: 16px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 14px; outline: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    
    .config-section-title {
      font-size: 13px; font-weight: 700; color: var(--primary);
      margin: 16px 0 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 4px;
    }
    .backup-buttons {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;
    }

    @media (min-width: 768px) {
      header {
        flex-direction: row; justify-content: space-between; align-items: center; padding: 12px 24px;
      }
      .header-actions {
        width: auto; flex: none;
      }
      .search-box {
        width: 220px;
      }
      .grid-cards {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      main {
        padding: 24px 16px;
      }
      .btn-text {
        display: inline !important;
      }
    }

    @media (max-width: 767px) {
      .btn-text {
        display: none;
      }
      .header-actions {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <!-- Tela de Bloqueio -->
  <div id="lock-screen">
    <div class="lock-card">
      <img id="lock-logo-img" src="./arquivos/Logo.png" alt="Logo" class="lock-logo" onerror="this.style.display='none'">
      <h2 id="lock-brand-name">Acesso Restrito</h2>
      <p>Introduza a senha do sistema</p>
      <form id="form-auth">
        <input type="password" id="pass" class="lock-input" placeholder="Senha..." autofocus required>
        <button type="submit" class="lock-btn">Entrar</button>
        <div id="lock-err" class="lock-err">Senha incorreta!</div>
      </form>
    </div>
  </div>

  <!-- Painel Principal -->
  <div id="app-container">
    <header>
      <div class="header-top">
        <div class="brand">
          <img id="header-logo-img" src="./arquivos/Logo.png" alt="Logo" class="header-logo" onerror="this.nextElementSibling.style.display='block'">
          <h1 id="header-brand-title">Mundo Digital</h1>
          <span id="header-brand-badge">Acesso Rápido</span>
        </div>
      </div>
      
      <div class="header-actions">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="input-pesquisa" class="search-input" placeholder="Pesquisar painel..." oninput="filtrarPaineis()">
        </div>
        <div class="action-buttons-group">
          <button id="btn-ordem" class="btn-secondary-action" onclick="alternarOrdem()" title="Ordem alfabética">
            <i class="fa-solid fa-arrow-down-a-z"></i> <span id="lbl-ordem" class="btn-text">Padrão</span>
          </button>
          <button class="btn-secondary-action" onclick="abrirModalNovaCategoria()" title="Nova Categoria">
            <i class="fa-solid fa-folder-plus"></i> <span class="btn-text">Categoria</span>
          </button>
          <button class="btn-action" onclick="abrirModalNovoPainel()" title="Novo Painel">
            <i class="fa-solid fa-plus"></i> <span class="btn-text">Painel</span>
          </button>
          <button class="btn-secondary-action" onclick="abrirModalConfig()" title="Configurações e Backup">
            <i class="fa-solid fa-gear"></i>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content"></main>
  </div>

  <input type="file" id="file-import" accept=".json,.txt" style="display:none;" onchange="processarArquivoImportado(event)">

  <!-- Modal: Configurações & Backup -->
  <div class="modal-overlay" id="modal-config">
    <div class="modal">
      <h3><i class="fa-solid fa-gear"></i> Configurações do Sistema</h3>
      <form onsubmit="salvarConfiguracoes(event)">
        
        <div class="config-section-title">Identidade Visual</div>
        <div class="form-group">
          <label>Nome da Empresa</label>
          <input type="text" id="cfg-nome" required>
        </div>
        <div class="form-group">
          <label>Etiqueta do Cabeçalho</label>
          <input type="text" id="cfg-badge" required>
        </div>
        <div class="form-group">
          <label>Caminho da Logo</label>
          <input type="text" id="cfg-logo" placeholder="./arquivos/Logo.png">
        </div>
        <div class="form-group">
          <label>Caminho do Fundo</label>
          <input type="text" id="cfg-fundo" placeholder="./arquivos/fundo.png">
        </div>

        <div class="config-section-title">Segurança</div>
        <div class="form-group">
          <label>Senha de Acesso</label>
          <input type="password" id="cfg-senha" required>
        </div>

        <div class="config-section-title">Sincronização & Backup</div>
        <button type="button" class="btn-action" onclick="forcarSincronizacaoRemota()" style="width:100%; justify-content:center; margin-bottom:10px;">
          <i class="fa-solid fa-arrows-rotate"></i> Forçar Sincronização do data.json
        </button>
        <div class="backup-buttons">
          <button type="button" class="btn-secondary-action" onclick="exportarBackup()" style="justify-content:center;">
            <i class="fa-solid fa-download"></i> Exportar JSON
          </button>
          <button type="button" class="btn-secondary-action" onclick="document.getElementById('file-import').click()" style="justify-content:center;">
            <i class="fa-solid fa-upload"></i> Importar JSON
          </button>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="fecharModal('modal-config')">Cancelar</button>
          <button type="submit" class="btn-action">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Categoria -->
  <div class="modal-overlay" id="modal-categoria">
    <div class="modal">
      <h3 id="cat-modal-title">Criar Categoria</h3>
      <form onsubmit="salvarCategoria(event)">
        <input type="hidden" id="cat-edit-id">
        <div class="form-group">
          <label>Nome da Categoria</label>
          <input type="text" id="cat-nome" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="fecharModal('modal-categoria')">Cancelar</button>
          <button type="submit" class="btn-action">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Painel -->
  <div class="modal-overlay" id="modal-painel">
    <div class="modal">
      <h3 id="panel-modal-title">Adicionar Painel</h3>
      <form onsubmit="salvarPainel(event)">
        <input type="hidden" id="p-edit-id">
        <div class="form-group">
          <label>Categoria</label>
          <select id="p-categoria" required></select>
        </div>
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="p-nome" required>
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <input type="text" id="p-desc">
        </div>
        <div class="form-group">
          <label>URL de Acesso</label>
          <input type="url" id="p-url" required>
        </div>
        <div class="form-group">
          <label>Logo / Imagem (Ex: ./arquivos/KvipNet.jpeg ou fa-solid fa-tv)</label>
          <input type="text" id="p-logo">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="fecharModal('modal-painel')">Cancelar</button>
          <button type="submit" class="btn-action">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let config = {
      senha: "kalleb7e",
      nome: "Mundo Digital",
      badge: "Acesso Rápido",
      logo: "./arquivos/Logo.png",
      fundo: "./arquivos/fundo.png"
    };

    let modoOrdem = parseInt(localStorage.getItem('md_ordem_modo')) || 0;
    let termoBusca = "";
    let categorias = [];
    let paineis = [];

    function normalizarCaminho(caminho) {
      if (!caminho) return "";
      let c = caminho.replace(/^(\/home\/pai\/Painel-Novo\/arquivos\/|\/home\/pai\/Imagens\/|\/arquivos\/)/, "arquivos/");
      if (c.startsWith("arquivos/")) {
        c = "./" + c;
      }
      return c;
    }

    async function buscarDataJson() {
      const resposta = await fetch('./data.json?t=' + Date.now());
      if (!resposta.ok) throw new Error("Não foi possível aceder ao data.json");
      const dados = await resposta.json();
      
      categorias = dados.categorias || [];
      paineis = dados.paineis || [];
      if (dados.config) config = { ...config, ...dados.config };

      config.logo = normalizarCaminho(config.logo);
      config.fundo = normalizarCaminho(config.fundo);
      paineis.forEach(p => p.logo = normalizarCaminho(p.logo));
      
      persistir();
    }

    async function forcarSincronizacaoRemota() {
      try {
        await buscarDataJson();
        fecharModal('modal-config');
        alert("Sincronização concluída com sucesso a partir do data.json!");
      } catch (e) {
        alert("Erro ao sincronizar: " + e.message);
      }
    }

    async function inicializarDados() {
      const dadosSalvos = localStorage.getItem('md_paineis_v4');
      
      if (!dadosSalvos || JSON.parse(dadosSalvos).length <= 1) {
        try {
          await buscarDataJson();
          return;
        } catch (e) {
          console.warn("Ficheiro data.json não encontrado localmente:", e);
        }
      }

      if (localStorage.getItem('md_config')) config = JSON.parse(localStorage.getItem('md_config'));
      if (localStorage.getItem('md_categorias')) categorias = JSON.parse(localStorage.getItem('md_categorias'));
      if (localStorage.getItem('md_paineis_v4')) paineis = JSON.parse(localStorage.getItem('md_paineis_v4'));

      config.logo = normalizarCaminho(config.logo);
      config.fundo = normalizarCaminho(config.fundo);
      paineis.forEach(p => p.logo = normalizarCaminho(p.logo));

      aplicarEstilosConfig();
      renderizarTudo();
    }

    function aplicarEstilosConfig() {
      const pageTitle = document.getElementById('page-title');
      const brandTitle = document.getElementById('header-brand-title');
      const brandBadge = document.getElementById('header-brand-badge');
      if (pageTitle) pageTitle.innerText = `${config.nome} - ${config.badge}`;
      if (brandTitle) brandTitle.innerText = config.nome;
      if (brandBadge) brandBadge.innerText = config.badge;
      
      const logoHeader = document.getElementById('header-logo-img');
      const logoLock = document.getElementById('lock-logo-img');
      if (logoHeader) logoHeader.src = config.logo;
      if (logoLock) logoLock.src = config.logo;

      const bgRule = `linear-gradient(rgba(6, 12, 26, 0.88), rgba(6, 12, 26, 0.92)), url('${config.fundo}')`;
      document.body.style.backgroundImage = bgRule;
      const lockScreen = document.getElementById('lock-screen');
      if (lockScreen) lockScreen.style.backgroundImage = `linear-gradient(rgba(6, 12, 26, 0.85), rgba(6, 12, 26, 0.92)), url('${config.fundo}')`;
    }

    function persistir() {
      localStorage.setItem('md_config', JSON.stringify(config));
      localStorage.setItem('md_categorias', JSON.stringify(categorias));
      localStorage.setItem('md_paineis_v4', JSON.stringify(paineis));
      localStorage.setItem('md_ordem_modo', modoOrdem);
      aplicarEstilosConfig();
      renderizarTudo();
    }

    function autenticar(e) {
      if (e) e.preventDefault();
      const passEl = document.getElementById('pass');
      const errEl = document.getElementById('lock-err');
      const lockScreen = document.getElementById('lock-screen');
      const appContainer = document.getElementById('app-container');

      if (passEl && passEl.value === config.senha) {
        if (lockScreen) lockScreen.style.display = 'none';
        if (appContainer) appContainer.style.display = 'flex';
        renderizarTudo();
      } else {
        if (errEl) errEl.style.display = 'block';
        if (passEl) {
          passEl.value = '';
          passEl.focus();
        }
      }
    }

    /* Safe DOM lookup para nunca estourar Uncaught TypeError */
    function abrirModal(id) { 
      const el = document.getElementById(id);
      if (el) {
        el.style.display = 'flex'; 
      } else {
        console.warn(`Elemento #${id} não encontrado no DOM.`);
      }
    }
    
    function fecharModal(id) { 
      const el = document.getElementById(id);
      if (el) {
        el.style.display = 'none'; 
      }
    }

    function alternarOrdem() {
      modoOrdem = (modoOrdem + 1) % 3;
      persistir();
    }

    function filtrarPaineis() {
      const searchEl = document.getElementById('input-pesquisa');
      termoBusca = searchEl ? searchEl.value.toLowerCase().trim() : "";
      renderizarTudo();
    }

    function abrirModalConfig() {
      const nomeEl = document.getElementById('cfg-nome');
      const badgeEl = document.getElementById('cfg-badge');
      const logoEl = document.getElementById('cfg-logo');
      const fundoEl = document.getElementById('cfg-fundo');
      const senhaEl = document.getElementById('cfg-senha');

      if (nomeEl) nomeEl.value = config.nome;
      if (badgeEl) badgeEl.value = config.badge;
      if (logoEl) logoEl.value = config.logo;
      if (fundoEl) fundoEl.value = config.fundo;
      if (senhaEl) senhaEl.value = config.senha;
      abrirModal('modal-config');
    }

    function salvarConfiguracoes(e) {
      e.preventDefault();
      const nomeEl = document.getElementById('cfg-nome');
      const badgeEl = document.getElementById('cfg-badge');
      const logoEl = document.getElementById('cfg-logo');
      const fundoEl = document.getElementById('cfg-fundo');
      const senhaEl = document.getElementById('cfg-senha');

      if (nomeEl) config.nome = nomeEl.value.trim();
      if (badgeEl) config.badge = badgeEl.value.trim();
      if (logoEl) config.logo = normalizarCaminho(logoEl.value.trim());
      if (fundoEl) config.fundo = normalizarCaminho(fundoEl.value.trim());
      if (senhaEl) config.senha = senhaEl.value;
      
      persistir();
      fecharModal('modal-config');
      alert("Configurações atualizadas!");
    }

    function exportarBackup() {
      const backupData = {
        config: config,
        categorias: categorias,
        paineis: paineis,
        versao: "2.0",
        dataExportacao: new Date().toISOString()
      };

      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `data.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function processarArquivoImportado(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const dados = JSON.parse(e.target.result);
          if (dados.categorias && dados.paineis) {
            categorias = dados.categorias;
            paineis = dados.paineis;
            if (dados.config) config = { ...config, ...dados.config };
            
            config.logo = normalizarCaminho(config.logo);
            config.fundo = normalizarCaminho(config.fundo);
            paineis.forEach(p => p.logo = normalizarCaminho(p.logo));

            persistir();
            fecharModal('modal-config');
            alert("Dados importados com sucesso!");
          } else {
            alert("Formato de ficheiro inválido!");
          }
        } catch (err) {
          alert("Erro ao ler ficheiro: " + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function abrirModalNovaCategoria() {
      const editId = document.getElementById('cat-edit-id');
      const nomeEl = document.getElementById('cat-nome');
      const titleEl = document.getElementById('cat-modal-title');
      if (editId) editId.value = '';
      if (nomeEl) nomeEl.value = '';
      if (titleEl) titleEl.innerText = "Criar Nova Categoria";
      abrirModal('modal-categoria');
    }

    function editarCategoria(catId) {
      const cat = categorias.find(c => c.id === catId);
      if (!cat) return;
      const editId = document.getElementById('cat-edit-id');
      const nomeEl = document.getElementById('cat-nome');
      const titleEl = document.getElementById('cat-modal-title');
      if (editId) editId.value = cat.id;
      if (nomeEl) nomeEl.value = cat.nome;
      if (titleEl) titleEl.innerText = "Editar Categoria";
      abrirModal('modal-categoria');
    }

    function salvarCategoria(e) {
      e.preventDefault();
      const editId = document.getElementById('cat-edit-id');
      const nomeEl = document.getElementById('cat-nome');
      const id = editId ? editId.value : null;
      const nome = nomeEl ? nomeEl.value.trim() : null;
      if (!nome) return;

      if (id) {
        const cat = categorias.find(c => c.id === id);
        if (cat) cat.nome = nome;
      } else {
        categorias.push({ id: "cat_" + Date.now(), nome });
      }
      persistir();
      fecharModal('modal-categoria');
      e.target.reset();
    }

    function removerCategoria(catId) {
      if (confirm("Eliminar esta categoria e todos os seus atalhos?")) {
        categorias = categorias.filter(c => c.id !== catId);
        paineis = paineis.filter(p => p.categoriaId !== catId);
        persistir();
      }
    }

    function preencherSelectCategorias(selectedId = '') {
      const select = document.getElementById('p-categoria');
      if (!select) return;
      select.innerHTML = '';
      categorias.forEach(cat => {
        const sel = cat.id === selectedId ? 'selected' : '';
        select.innerHTML += `<option value="${cat.id}" ${sel}>${cat.nome}</option>`;
      });
    }

    function abrirModalNovoPainel() {
      if (categorias.length === 0) {
        alert("Crie primeiro uma categoria.");
        abrirModalNovaCategoria();
        return;
      }
      const editId = document.getElementById('p-edit-id');
      const nomeEl = document.getElementById('p-nome');
      const descEl = document.getElementById('p-desc');
      const urlEl = document.getElementById('p-url');
      const logoEl = document.getElementById('p-logo');
      const titleEl = document.getElementById('panel-modal-title');

      if (editId) editId.value = '';
      if (nomeEl) nomeEl.value = '';
      if (descEl) descEl.value = '';
      if (urlEl) urlEl.value = '';
      if (logoEl) logoEl.value = '';
      if (titleEl) titleEl.innerText = "Adicionar Novo Painel";
      
      preencherSelectCategorias();
      abrirModal('modal-painel');
    }

    function editarPainel(id) {
      const p = paineis.find(item => item.id === id);
      if (!p) return;
      const editId = document.getElementById('p-edit-id');
      const nomeEl = document.getElementById('p-nome');
      const descEl = document.getElementById('p-desc');
      const urlEl = document.getElementById('p-url');
      const logoEl = document.getElementById('p-logo');
      const titleEl = document.getElementById('panel-modal-title');

      if (editId) editId.value = p.id;
      if (nomeEl) nomeEl.value = p.nome;
      if (descEl) descEl.value = p.desc;
      if (urlEl) urlEl.value = p.url;
      if (logoEl) logoEl.value = p.logo || '';
      if (titleEl) titleEl.innerText = "Editar Painel";

      preencherSelectCategorias(p.categoriaId);
      abrirModal('modal-painel');
    }

    function salvarPainel(e) {
      e.preventDefault();
      const editId = document.getElementById('p-edit-id');
      const catEl = document.getElementById('p-categoria');
      const nomeEl = document.getElementById('p-nome');
      const descEl = document.getElementById('p-desc');
      const urlEl = document.getElementById('p-url');
      const logoEl = document.getElementById('p-logo');

      const id = editId ? editId.value : null;
      const categoriaId = catEl ? catEl.value : null;
      const nome = nomeEl ? nomeEl.value.trim() : "";
      const desc = descEl ? descEl.value.trim() || "Atalho" : "Atalho";
      const url = urlEl ? urlEl.value.trim() : "";
      const logo = logoEl ? normalizarCaminho(logoEl.value.trim()) : "";

      if (id) {
        const p = paineis.find(item => item.id === Number(id));
        if (p) {
          p.categoriaId = categoriaId;
          p.nome = nome;
          p.desc = desc;
          p.url = url;
          p.logo = logo;
        }
      } else {
        paineis.push({
          id: Date.now(),
          categoriaId,
          nome,
          desc,
          url,
          logo,
          favorito: false
        });
      }
      persistir();
      fecharModal('modal-painel');
      e.target.reset();
    }

    function removerPainel(id) {
      if (confirm("Eliminar este painel?")) {
        paineis = paineis.filter(p => p.id !== id);
        persistir();
      }
    }

    function alternarFavorito(id) {
      const p = paineis.find(item => item.id === id);
      if (p) {
        p.favorito = !p.favorito;
        persistir();
      }
    }

    function extrairDominio(url) {
      try { return new URL(url).hostname; } catch { return ''; }
    }

    function renderizarIcone(p) {
      if (p.logo) {
        if (p.logo.startsWith('fa-') || p.logo.startsWith('fas ') || p.logo.startsWith('fa-solid') || p.logo.startsWith('fa-brands')) {
          return `<i class="${p.logo}"></i>`;
        }
        return `<img src="${p.logo}" alt="Logo" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\\'fa-solid fa-globe\\\'></i>';">`;
      }
      const dom = extrairDominio(p.url);
      if (dom) {
        return `<img src="https://www.google.com/s2/favicons?domain=${dom}&sz=64" alt="Icon" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\\'fa-solid fa-tv\\\'></i>';">`;
      }
      return `<i class="fa-solid fa-tv"></i>`;
    }

    function gerarCardHTML(p) {
      const favClass = p.favorito ? 'is-fav' : '';
      const favIcon = p.favorito ? 'fa-solid fa-star' : 'fa-regular fa-star';
      return `
        <div class="panel-card">
          <div class="panel-header">
            <div class="panel-icon-box">${renderizarIcone(p)}</div>
            <div class="panel-info">
              <div class="panel-name" title="${p.nome}">${p.nome}</div>
              <div class="panel-desc" title="${p.desc}">${p.desc}</div>
            </div>
            <div class="panel-ctrls">
              <button class="btn-card-ctrl fav-btn ${favClass}" onclick="alternarFavorito(${p.id})" title="Favorito"><i class="${favIcon}"></i></button>
              <button class="btn-card-ctrl" onclick="editarPainel(${p.id})" title="Editar"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-card-ctrl del" onclick="removerPainel(${p.id})" title="Excluir"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div class="panel-links">
            <a href="${p.url}" target="_blank" class="btn-open"><i class="fa-solid fa-arrow-up-right-from-square"></i> Acessar</a>
          </div>
        </div>
      `;
    }

    function ordenarLista(lista) {
      if (modoOrdem === 1) {
        return [...lista].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }));
      } else if (modoOrdem === 2) {
        return [...lista].sort((a, b) => b.nome.localeCompare(a.nome, 'pt-BR', { sensitivity: 'base' }));
      }
      return lista;
    }

    function renderizarTudo() {
      const btnOrdem = document.getElementById('btn-ordem');
      if (btnOrdem) {
        if (modoOrdem === 1) {
          btnOrdem.classList.add('active-sort');
          btnOrdem.innerHTML = '<i class="fa-solid fa-arrow-down-a-z"></i> <span id="lbl-ordem" class="btn-text">A-Z</span>';
        } else if (modoOrdem === 2) {
          btnOrdem.classList.add('active-sort');
          btnOrdem.innerHTML = '<i class="fa-solid fa-arrow-down-z-a"></i> <span id="lbl-ordem" class="btn-text">Z-A</span>';
        } else {
          btnOrdem.classList.remove('active-sort');
          btnOrdem.innerHTML = '<i class="fa-solid fa-arrow-down-short-wide"></i> <span id="lbl-ordem" class="btn-text">Padrão</span>';
        }
      }

      const container = document.getElementById('main-content');
      if (!container) return;
      container.innerHTML = '';

      const paineisFiltrados = paineis.filter(p => {
        if (!termoBusca) return true;
        return p.nome.toLowerCase().includes(termoBusca) || p.desc.toLowerCase().includes(termoBusca);
      });

      const favoritos = ordenarLista(paineisFiltrados.filter(p => p.favorito));
      if (favoritos.length > 0) {
        let favCards = favoritos.map(p => gerarCardHTML(p)).join('');
        container.innerHTML += `
          <div class="category-group fav-group">
            <div class="category-header">
              <div class="category-title"><i class="fa-solid fa-star"></i> Meus Favoritos</div>
            </div>
            <div class="grid-cards">${favCards}</div>
          </div>
        `;
      }

      if (categorias.length === 0) {
        container.innerHTML += `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            <p>Nenhuma categoria encontrada. Clique em <strong>Categoria</strong> acima para começar.</p>
          </div>
        `;
        return;
      }

      let encontrouAlgum = favoritos.length > 0;

      categorias.forEach(cat => {
        let itens = ordenarLista(paineisFiltrados.filter(p => p.categoriaId === cat.id));

        if (termoBusca && itens.length === 0) return;

        encontrouAlgum = true;
        let cardsHtml = '';
        if (itens.length === 0) {
          cardsHtml = `<div style="grid-column: 1/-1; font-size: 13px; color: var(--text-muted);">Nenhum atalho cadastrado nesta categoria.</div>`;
        } else {
          cardsHtml = itens.map(p => gerarCardHTML(p)).join('');
        }

        container.innerHTML += `
          <div class="category-group">
            <div class="category-header">
              <div class="category-title"><i class="fa-solid fa-folder-open"></i> ${cat.nome}</div>
              <div class="cat-actions">
                <button class="btn-cat-tool" onclick="editarCategoria('${cat.id}')" title="Renomear Categoria"><i class="fa-solid fa-pen"></i> Renomear</button>
                <button class="btn-cat-tool del" onclick="removerCategoria('${cat.id}')" title="Excluir Categoria"><i class="fa-solid fa-trash-can"></i> Excluir</button>
              </div>
            </div>
            <div class="grid-cards">${cardsHtml}</div>
          </div>
        `;
      });

      if (!encontrouAlgum && termoBusca) {
        container.innerHTML = `
          <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
            <i class="fa-solid fa-magnifying-glass" style="font-size: 32px; margin-bottom: 12px; display: block; opacity: 0.5;"></i>
            <p>Nenhum painel encontrado para "<strong>${termoBusca}</strong>".</p>
          </div>
        `;
      }
    }

    // Inicialização segura no DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
      const authForm = document.getElementById('form-auth');
      if (authForm) {
        authForm.addEventListener('submit', autenticar);
      }
      inicializarDados();
    });
  </script>
</body>
</html>
